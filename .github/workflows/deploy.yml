# Construit les images Docker sur GitHub (le serveur Dokploy n'a que 4 Go de RAM
# et chaque build le faisait swapper), les publie sur ghcr.io, puis demande à
# Dokploy de redéployer : le serveur ne fait plus que télécharger les images.
# Même principe que le dépôt rdv.
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   DOKPLOY_URL         ex. https://srko.fr
#   DOKPLOY_API_KEY     Dokploy > Settings > Profile > API/CLI > Generate
#   DOKPLOY_COMPOSE_ID  id du service dans Dokploy (dans l'URL de sa page)
# Sans ces secrets, les images sont publiées et il suffit de cliquer « Deploy » dans Dokploy.
name: Build et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom des images
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}-frontend:latest
            ${{ env.IMAGE }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Image celcat-nuit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/celcat-sidecar/Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}-celcat:latest
            ${{ env.IMAGE }}-celcat:${{ github.sha }}
          cache-from: type=gha,scope=celcat
          cache-to: type=gha,scope=celcat,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Redéployer sur Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          # Retire espaces et retours chariot éventuels collés aux secrets.
          DOKPLOY_URL=$(printf '%s' "$DOKPLOY_URL" | tr -d '[:space:]')
          DOKPLOY_API_KEY=$(printf '%s' "$DOKPLOY_API_KEY" | tr -d '[:space:]')
          DOKPLOY_COMPOSE_ID=$(printf '%s' "$DOKPLOY_COMPOSE_ID" | tr -d '[:space:]')
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::warning::Secrets Dokploy absents : images publiées, déploiement à lancer depuis Dokploy."
            exit 0
          fi
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
