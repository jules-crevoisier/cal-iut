# Stack complète (front + backend) — utilisable en local pour tester avant
# Dokploy, ou directement comme déploiement Docker Compose dans Dokploy si
# tu préfères ce mode au mode "Dockerfile x2 services".
#
#   docker compose up --build
#   → http://localhost:8080

services:
  backend:
    build: .
    expose:
      - "8000"
    environment:
      # OBLIGATOIRE — sans lui, TOUTE l'API répond 503 (cf. api/auth.py,
      # blocage volontaire plutôt qu'un accès libre par défaut). Change
      # cette valeur avant un vrai déploiement.
      CAL_IUT_PASSWORD: cal-iut-2026
      # Optionnel — sans lui, un secret est généré au premier démarrage et
      # écrit dans le volume `cal-iut-data` (donc stable tant que ce volume
      # existe). Le fixer explicitement évite de perdre les liens
      # enseignants déjà envoyés si le volume est un jour recréé.
      # CAL_IUT_SECRET_KEY: change-moi-aussi
    volumes:
      # Named volume : seedé UNE fois depuis data/cal-iut.db baké dans
      # l'image (cf. Dockerfile), puis les écritures ultérieures
      # (glisser-déposer, régénération...) y survivent aux redémarrages.
      - cal-iut-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cal-iut-data:
