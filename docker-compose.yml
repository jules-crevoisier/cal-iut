# Stack complète (front + backend + drain nocturne Celcat) — utilisable en
# local pour tester avant Dokploy, ou directement comme déploiement Docker
# Compose dans Dokploy si tu préfères ce mode au mode "Dockerfile x2 services".
#
# IMPORTANT (05/09/2026) : le service `celcat-nuit` ci-dessous n'est
# déployé automatiquement QUE si Dokploy est bien configuré en mode
# "Docker Compose" pointant sur CE fichier. En mode "Dockerfile x2
# services" (un Dockerfile par service, configuré à la main dans Dokploy),
# ce fichier n'est jamais lu — il faut alors ajouter `celcat-nuit` comme un
# 3e service Dokploy séparé (Dockerfile = deploy/celcat-sidecar/Dockerfile,
# même volume `cal-iut-data` que `backend`, mêmes variables CELCAT_*/VPN_*
# ci-dessous, cap_add NET_ADMIN + device /dev/net/tun). À vérifier dans le
# dashboard Dokploy avant de compter sur le déploiement automatique.
#
# Local :
#   cp .env.example .env   # puis remplir les valeurs
#   docker compose up --build
#   → http://localhost:8080
#
# Dokploy : AUCUNE valeur ici, tout passe par `${VAR}` — Docker Compose lit
# ces variables dans l'environnement du process qui lance `docker compose`
# (ou un `.env` à côté de ce fichier, jamais commité), qui est exactement ce
# que Dokploy pose quand tu renseignes ses variables d'environnement pour ce
# service. Une variable non définie donne une valeur vide. L'accès passe par
# les comptes utilisateurs (cf. api/accounts.py) : aucune variable ne donne
# un accès libre. Détail des variables : docs/ADMIN.md.

services:
  backend:
    build: .
    expose:
      - "8000"
    environment:
      # N'est plus lue par l'API (comptes utilisateurs depuis le 31/08/2026) ;
      # gardée pour ne pas casser un déploiement qui la renseigne encore.
      CAL_IUT_PASSWORD: ${CAL_IUT_PASSWORD}
      # Optionnel — sans elle, un secret est généré au premier démarrage et
      # écrit dans le volume `cal-iut-data` (donc stable tant que ce volume
      # existe). Il signe les sessions de connexion : la fixer évite de
      # déconnecter tout le monde si ce volume est un jour recréé.
      CAL_IUT_SECRET_KEY: ${CAL_IUT_SECRET_KEY}
      # Envoi automatique du lien perso par mail (`POST /mail/teacher-links/
      # send`, cf. api/mailer.py). Sans `RESEND_API_KEY`/`CAL_IUT_PUBLIC_URL`,
      # le bouton d'envoi reste visible mais chaque tentative échoue avec un
      # message explicite plutôt qu'un envoi silencieux ou un lien cassé.
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      CAL_IUT_PUBLIC_URL: ${CAL_IUT_PUBLIC_URL}
      # MCP distant (`POST /mcp`) — absent ou vide → 503, login site inchangé.
      CAL_IUT_MCP_TOKEN: ${CAL_IUT_MCP_TOKEN}
      # Règles d'envoi Celcat (WR100BU, PTUT — celcat.yaml::regles_envoi) :
      # `off` tant que l'administrateur ne les a pas essayées
      # (docs/A-TESTER-SUR-CELCAT.md). MÊME valeur que pour `celcat-nuit`.
      CAL_IUT_REGLES_ENVOI: ${CAL_IUT_REGLES_ENVOI:-off}
    volumes:
      # `data/state/` SEULEMENT (pas `data/` en entier) — sépare la config
      # (rafraîchie à chaque déploiement, hors du volume) de l'état
      # (base SQLite, secret HMAC, journal des mails envoyés), qui doit
      # persister. Named volume : seedé UNE fois depuis data/state/cal-iut.db
      # baké dans l'image (cf. Dockerfile), puis les écritures ultérieures
      # (glisser-déposer, régénération...) y survivent aux redémarrages.
      - cal-iut-data:/app/data/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  # Draine chaque nuit (00h00) la file Celcat que `backend` remplit
  # (déplacements/créations/suppressions faits sur le site) — cf.
  # docs/CELCAT.md (« Pour les techniciens »). Conteneur
  # À PART de `backend` : lui seul monte le VPN URCA (un tunnel complet,
  # coupe tout le reste du trafic sortant si monté ailleurs). Partage
  # `data/state/` avec `backend` via le MÊME volume nommé : voit donc les
  # vrais jobs mis en file par l'appli déployée, jamais une copie locale.
  #
  # `NET_ADMIN`/`/dev/net/tun` : nécessaires à openconnect (client VPN) pour
  # créer l'interface tun — sans lien avec les privilèges de `backend`.
  celcat-nuit:
    build:
      context: .
      dockerfile: deploy/celcat-sidecar/Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      CELCAT_URL: ${CELCAT_URL}
      # Règles d'envoi Celcat : MÊME valeur que pour `backend` (`off` par défaut).
      CAL_IUT_REGLES_ENVOI: ${CAL_IUT_REGLES_ENVOI:-off}
      CELCAT_UTILISATEUR: ${CELCAT_UTILISATEUR}
      CELCAT_MOT_DE_PASSE: ${CELCAT_MOT_DE_PASSE}
      # Optionnels — sans eux, reseau.py retombe sur CELCAT_UTILISATEUR/
      # CELCAT_MOT_DE_PASSE ci-dessus pour la connexion VPN elle-même.
      VPN_PASSERELLE: ${VPN_PASSERELLE}
      VPN_UTILISATEUR: ${VPN_UTILISATEUR}
      VPN_MOT_DE_PASSE: ${VPN_MOT_DE_PASSE}
      VPN_GROUPE: ${VPN_GROUPE}
      VPN_CODE: ${VPN_CODE}
    volumes:
      - cal-iut-data:/app/data/state
    restart: unless-stopped

volumes:
  cal-iut-data:
