# Séances ANNULÉES : des heures qui n'auront pas lieu.
#
# À ne pas confondre avec un retrait du planning. Une séance simplement
# dépointée redevient une séance « à placer » : elle réapparaît dans
# l'inventaire, dans « À traiter », et au prochain placement automatique.
# Déclarée ici, elle cesse d'exister dès l'INGESTION — donc elle ne revient
# pas au redémarrage du serveur, qui ré-ingère à chaque fois.
#
# Ce fichier, et pas un appel d'API, parce que la maquette distante
# continuera d'annoncer ces heures : c'est la seule forme qui survive à un
# `cal-iut fetch`.
#
# Chaque entrée porte QUI l'a demandée et QUAND. Dans un an, une annulation
# sans justification est soit supprimée à tort, soit conservée à tort — même
# principe que `evenements_supplementaires.yaml`.
#
# Champs :
#   session_id   identifiant exact de la séance (cf. data/generated/sessions.json)
#   motif        pourquoi elle n'aura pas lieu, en clair
#   demande_par  qui l'a demandé
#   le           date de la demande (ISO)

annulees:
  # Les quatre dernières 1h30 de TD de WR104, une par groupe. Chaque groupe
  # avait deux séances de 3h puis ce reliquat isolé de 1h30, plusieurs
  # semaines plus tard.
  #
  # Martial Martin, 29/08/2026 : « la dernière 1,5h de TD éparpillée le 25
  # janvier pour AB, le 18 novembre pour CD, le 4 novembre pour EF, le 7
  # octobre pour GH ; le mieux est de les supprimer, je ne vais pas pouvoir
  # en faire quelque chose. »
  #
  # Les dates citées désignent le LUNDI de la semaine ; les séances tombent
  # le mercredi (AB : 27/01 et non 25/01). Identifiées par leur STRUCTURE —
  # la troisième et dernière séance de chaque groupe, la seule de 1h30 —
  # plutôt que par la date, pour éviter de supprimer la mauvaise.
  - session_id: WR104-S1-TD-3-but1-td-ab
    motif: "Reliquat isolé de 1h30 (mer. 27/01/2027), inexploitable pédagogiquement"
    demande_par: "Martial Martin"
    le: "2026-08-29"

  - session_id: WR104-S1-TD-3-but1-td-cd
    motif: "Reliquat isolé de 1h30 (mer. 18/11/2026), inexploitable pédagogiquement"
    demande_par: "Martial Martin"
    le: "2026-08-29"

  - session_id: WR104-S1-TD-3-but1-td-ef
    motif: "Reliquat isolé de 1h30 (mer. 04/11/2026), inexploitable pédagogiquement"
    demande_par: "Martial Martin"
    le: "2026-08-29"

  - session_id: WR104-S1-TD-3-but1-td-gh
    motif: "Reliquat isolé de 1h30 (mer. 07/10/2026), inexploitable pédagogiquement"
    demande_par: "Martial Martin"
    le: "2026-08-29"

  # Journée du 16/09/2026 : Martial Martin y avait 6h de CM d'affilée (CM-2 à
  # CM-5), plus un TD de 3h. « Physiquement, je ne peux pas y arriver et je
  # pense que les étudiants ne suivront rien. Peux-tu conserver seulement un
  # créneau de 3h en continu [...] récupérer 3h plus tard quand tu peux, ou
  # juste conserver 1,5h à positionner en novembre pour faire un DS ? »
  #
  # CM-2 et CM-3 restent (08h-11h, les 3h continues demandées).
  # CM-4 a été DÉPLACÉ au mercredi 11/11/2026 08h00 — c'est le « 1,5h en
  # novembre » de sa troisième option.
  # CM-5 est annulé : aucun créneau valide dans TOUT le reste du semestre
  # (756 refus d'ordre pédagogique, 513 indisponibilités MMA, 361 verrou PAC
  # jeudi après-midi — zéro créneau valide). Le déplacer était impossible,
  # le laisser aurait maintenu la journée qu'il signale.
  # CONFIRMÉ le 30/08/2026 après mesure, malgré une réticence initiale
  # (« je ne suis pas trop pour »). Le chiffre `cm` de la maquette compte des
  # SÉANCES, pas des heures : vérifié sur cinq autres modules où il égale
  # exactement le nombre de CM générés (WR106 3=3, WR105 6=6, WR109 2=2,
  # WR119 4=4, WR103 3=3). WR104 en déclare 5 ; il en reste 3. Le déficit de
  # DEUX séances est donc réel et assumé, pas un effet de bord.
  #
  # Les deux autres options de Martial Martin étaient impossibles : sur tout
  # le semestre, CM-4 et CM-5 n'ont que quatre créneaux valides — deux avant
  # le CM-1 (à contresens du contenu) et deux le 16/09, précisément la
  # journée qu'il demandait d'alléger.
  - session_id: WR104-S1-CM-5
    motif: "16/09 : 6h de CM d'affilée ramenées à 3h ; CM-4 reporté au 11/11, CM-5 sans créneau valide"
    demande_par: "Martial Martin"
    le: "2026-08-29"

  # CM-4 : je l'avais reporté au mercredi 11 novembre 2026 — un JOUR FÉRIÉ
  # (Armistice). Erreur repérée par Kyllian Bresson le 30/08/2026 : « l'outil
  # parle du 11 novembre qui est un jour férié ». C'était la seule séance de
  # tout le planning posée ce jour-là ; le contrôle des fériés manquait au
  # déplacement manuel, il est ajouté par ailleurs.
  #
  # Une fois le férié écarté, il ne reste QUATRE créneaux valides sur toute
  # l'année pour cette séance : mardi 08/09 08h, mercredi 09/09 08h — tous
  # deux AVANT le CM-1 du 09/09, donc à contresens du contenu — et mercredi
  # 16/09 à 11h ou 14h, c'est-à-dire précisément la journée que Martial
  # Martin demandait d'alléger. Les refus viennent de l'ordre pédagogique
  # (704) et de ses propres indisponibilités déclarées (546).
  #
  # « Récupérer 3h plus tard » et « 1,5h en novembre pour un DS » sont donc
  # tous deux impossibles en l'état. On retient sa première option :
  # « redonner les autres heures de CM à des collègues ». RÉVERSIBLE — il
  # suffit de retirer cette entrée pour que la séance revienne.
  - session_id: WR104-S1-CM-4
    motif: "16/09 allégé : aucun créneau valide hors du 16/09 lui-même (ordre pédagogique + indisponibilités MMA)"
    demande_par: "Martial Martin"
    le: "2026-08-30"

  # Justine Hussenet (JHU), relais Kyllian Bresson, 31/08/2026 14h06 : « Ne
  # souhaite plus assurer les CM pour les différents modules dans lequel
  # elle intervient WR303D ; WRA303M ; WRA309M, il faut donc lui supprimer
  # tous ses CM. » Vérification : seul WR303D a effectivement des CM à son
  # nom (2 séances) — WRA303M et WRA309M n'ont aucun volume de CM au
  # programme (volumes.cm = 0 dans progression.json), rien à faire dessus.
  # Elle est seule enseignante déclarée sur WR303D (pas de co-intervenant) :
  # décision utilisateur du 31/08/2026, le contenu est retiré plutôt que
  # réassigné.
  - session_id: WR303D-S3-CM-1
    motif: "JHU ne souhaite plus assurer de CM (pas de co-intervenant déclaré sur WR303D)"
    demande_par: "Justine Hussenet, via Kyllian Bresson"
    le: "2026-08-31"

  - session_id: WR303D-S3-CM-2
    motif: "JHU ne souhaite plus assurer de CM (pas de co-intervenant déclaré sur WR303D)"
    demande_par: "Justine Hussenet, via Kyllian Bresson"
    le: "2026-08-31"
