# --- Groupes : convention de nommage Celcat ---
# Relevée le 31/08/2026 (S1, S3, S5, en CM, TD et TP) :
#     BUT MMI <semestre> <libellé du groupe> - <année de cohorte>
# soit « BUT MMI S1 TD AB - 2024 ». Le suffixe est l'année d'ENTRÉE de la
# cohorte, pas celle de la base : dans URCA_2026 les groupes s'appellent
# encore « - 2024 ». Une recherche sans le suffixe les retrouve, ce qui
# évite d'avoir à deviner l'année (cf. `celcat/navigateur.py`).
# Le département Celcat est « T_MMI T29 ».
groupes:
  convention: "BUT MMI {semestre} {libelle} - {annee}"
  annee_cohorte: "2024"
  departement: "T_MMI"

# --- Types de séance : le nôtre -> code Celcat ---
# TD=4 et TP=6 sont des INDEX DE POSITION hérités des `.bat`. Le pilote
# n'en a plus besoin : il dépose le LIBELLÉ relevé le 01/09/2026
# (`[TD]`, `[TP]`, `[CM]` dans celcat_formulaire.yaml).
types_seance:
  TD: 4
  TP: 6
  CM: null   # Catégorie « [CM] » relevée. Distincte de « [CM bénévole] »
             # (event_cat_id 845) et « [CM Capacite] ». TD=4/TP=6 restent des
             # INDEX DE POSITION hérités des .bat, pas des event_cat_id.
             # L'écriture RPC n'utilise plus cet index.
  PTUT: null # À CONFIRMER

