# Cours absents de l'export maquette distant (code encore inconnu de
# l'administration / ajout tardif) — même logique de survie à un re-fetch
# que `course_corrections.yaml` : ces entrées sont injectées dans la liste
# `maquette` AVANT `merge_exports` (cf. `ingestion/pipeline.py`), donc
# traitées à l'identique d'une vraie ligne de l'export distant.
#
# Chaque entrée doit avoir la forme exacte d'une ligne `maquette.json`
# (cf. `ingestion/merge.py::merge_exports` pour les champs consommés).
courses:
  - code_matiere: WR100BU
    nom_matiere: "Jeu de piste BU"
    semestre: S1
    parcours: BUT1
    lead: {code: VMA, nom: MARIOT, prenom: VALERIE}
    total: {cm: 0, td: 3, tp: 0}
    profs:
      - block: block1
        code: VMA
        nom: MARIOT
        prenom: VALERIE
        cm: 0
        td: 12
        tp: 0
        nbGpTd: 4
        nbGpTp: 0
    maquette:
      groupes: {td: 4, tp: 0}
      bloque: false
      hors_service: false
    note: >
      Retour utilisateur (06/08/2026) : code "WR100BU" inventé par Kyllian
      Bresson pour l'intervention de Valérie Mariot (BU), qui ne connaît
      pas son code matière officiel — absent de l'export maquette distant,
      donc jamais écrasé par un re-fetch. Volume par étudiant : 3 TD
      (4h30). Volume enseignant : 12 TD (18h) = 3 séances x 4 groupes TD,
      VMA seule sur les 4 groupes (nbGpTd=4).

      Ligne source "DGA prend en charge tous les groupes A ; B" NON reprise
      ici — question RÉSOLUE le 10/08/2026 : "Maquette 2026 BUT3 S5-DEV-FI.docx"
      identifie DGA comme Dilusha Ganewatt, qui enseigne l'anglais WR501D en
      BUT3, sans aucun lien avec WR100BU. Cette ligne est un résidu de gabarit
      recopié d'un module à l'autre (elle apparaît telle quelle sous plusieurs
      modules du .docx), et le volume donné pour VMA (12 TD = 4 groupes x 3
      séances) ne laisse de toute façon aucune place à un second enseignant.
      VMA solo sur les 4 groupes TD : confirmé.

      Fenêtres de dates données par Kyllian — désormais CÂBLÉES en contraintes
      dures (arbitrage utilisateur 10/08/2026), cf.
      `data/config/course_scheduling_rules.yaml > session_date_windows` :
      TD n°1 (visite BU) du 1er au 15 septembre 2026, TD n°2 et n°3 (salle
      informatique) du 14 septembre au 15 octobre 2026.

      Reste manuel : les salles A123 et "Salle Informatique" sont hors du parc
      géré par `rooms.yaml` (convention "H.xxx" du bâtiment H). Le solveur
      assignera une salle générique du bâtiment H, À CORRIGER MANUELLEMENT
      après résolution (Vue Semaine) pour ces 3 séances précisément.
