# Disponibilités enseignants — extraites manuellement des commentaire_edt en V1
# Format slot: [jour (0=lundi), créneau (0=8h-9h30)]
teachers:
  - teacher_code: JUL  # Julie — WS301D, WS401D
    max_afternoons_per_week: 3
    notes: "2 à 3 après-midis selon durée SAE"

  - teacher_code: ALO  # Ariane LOIZON
    preferred_days: [3]  # jeudi
    notes: "Préférence jeudi pour journées entières (WR403D)"

  - teacher_code: KBR  # Kyllian Bresson
    forbidden_slots: [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]]  # créneau 0 (8h-9h30), tous les jours
    notes: "Retour utilisateur (06/08/2026) : ne débute ses cours qu'à partir de 9h30."

  # --- Pré-rentrée BUT2 FC alternants, jeudi 3 septembre 2026 ---------------
  # Demande de Kyllian Bresson, 26/08/2026 : « FLI et AFR doivent être
  # disponibles sur ce créneau, il ne faut pas leur mettre des cours ».
  #
  # 9h30-12h30 = créneaux 1 (9h30-11h) et 2 (11h-12h30). Leur après-midi reste
  # libre : bloquer la journée entière les priverait de quatre créneaux sans
  # raison.
  #
  # Le blocage de parcours déclaré dans `evenements_supplementaires.yaml` ne
  # suffit PAS : il protège les étudiants de BUT2-CREACOM-FC, pas les
  # enseignants — FLI et AFR interviennent aussi en BUT1 et BUT2-DEV-FI, et
  # resteraient programmables devant ces promotions à la même heure.
  - teacher_code: FLI  # Florent Libbrecht
    forbidden_date_slots:
      - date: "2026-09-03"
        slots: [1, 2]
        note: "Pré-rentrée BUT2 FC alternants 9h30-12h30 (Kyllian Bresson, 26/08/2026)"

  - teacher_code: AFR  # Anthony Froli
    forbidden_date_slots:
      - date: "2026-09-03"
        slots: [1, 2]
        note: "Pré-rentrée BUT2 FC alternants 9h30-12h30 (Kyllian Bresson, 26/08/2026)"

  # --- Barthélémy TOMASINA : matins de septembre ---------------------------
  # Mail du 28/08/2026 (à Kyllian, Jules, Fabrice) : « Habituellement je
  # commence les cours en novembre et je ne pensais pas avoir des cours en
  # septembre. [...] concernant septembre, je suis indisponible tous les
  # matins de ce mois. » Disponibilité annoncée à partir d'octobre : la
  # restriction s'arrête donc au 30 septembre, elle n'est pas reconduite.
  #
  # Créneaux 0/1/2 = 8h-9h30, 9h30-11h, 11h-12h30. Ses après-midis restent
  # ouverts (c'est explicitement ce qu'il propose), d'où un blocage par
  # créneaux et non par journée entière.
  #
  # Dates énumérées une à une : `forbidden_date_slots` est le seul des cinq
  # mécanismes qui sache viser une date précise, il n'existe pas de forme
  # « tout un mois ». Les 22 jours ci-dessous sont les jours de cours réels
  # de septembre 2026, dérivés du calendrier (pas saisis à la main).
  - teacher_code: BTO  # Barthélémy Tomasina (vacataire)
    forbidden_date_slots:
      - date: "2026-09-01"
        slots: [0, 1, 2]
        note: "Indisponible les matins de septembre (mail du 28/08/2026)"
