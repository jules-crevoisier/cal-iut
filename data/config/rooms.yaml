# Salles IUT MMI Troyes — inventaire réel bâtiment H (+ A.018 pour évaluations)
# Source : cahier des charges §11-12 (cartographie salles + règles par module S1).
#
# NB : H.001 (salle de réunion, 10 places) est explicitement exclue des cours
# (usage BDE) -> volontairement absente de la liste ci-dessous.
#
# "Hack Celcat" : Celcat n'autorise qu'1 enseignant par salle. Pour synchroniser
# 2 enseignants sur un même créneau/module, on les place dans 2 salles Celcat
# distinctes mais physiquement collées/communicantes : H.007+H.008, H.201+H.203,
# H.017+H.022 (H.022 = local de rangement attenant au Studio, sert de salle
# fantôme). Elles restent donc modélisées comme des salles bookables séparées
# pour ce cas-là (2 enseignants, 2 salles).
#
# Salle "fusion" (28/08/2026) : H.007+H.008 et H.201+H.203 sont EN PLUS
# modélisées comme une salle combinée à part entière (`room_type: combined`,
# `combines: [...]`) — pour le cas où c'est UN SEUL cours trop grand pour une
# moitié seule, pas deux enseignants synchronisés. Le double-booking entre la
# salle fusionnée et ses moitiés est bloqué par construction, cf.
# `solver/rooms.py::_build_conflict_map`/`_is_free` — la crainte du
# commentaire d'origine (double-booking) est donc levée pour ce mécanisme-là.
rooms:
  # --- RDC ---
  - id: h005
    label: H.005
    capacity: 15
    room_type: tp_standard
    equipment: [ilots, bar_chaises_hautes, televiseur]

  - id: h006
    label: H.006
    # Corrigé de 30 à 15 (retour utilisateur 28/08/2026, verbatim : « la h006
    # fait 15 place max ») — la capacité affichée servait de repli TD (les TD
    # préfèrent les salles `standard`, cf. `room_assignment_rules` plus bas,
    # H.006 n'intervenant qu'en repli faute de salle standard libre) et
    # atterrissait pile sur l'effectif TD BUT1 (30/30), ce qui ne correspond
    # pas à la vraie salle.
    capacity: 15
    room_type: tp_standard
    equipment: [televiseur]  # communique avec H.009

  - id: h007
    label: H.007
    # 30 -> 15 (retour utilisateur 28/08/2026 : « la 05 06 07 08 sont toutes
    # les salle de tp donc environ 15 »), même correction que H.006 le
    # 28/08/2026 (au-dessus). Reste réservable seule, cloison fermée — pour
    # un TD trop grand, cf. la salle fusionnée `h007_h008` ci-dessous.
    capacity: 15
    room_type: tp_standard
    equipment: [cloison_amovible_h008]  # ouvrable -> 1 salle TD avec H.008

  - id: h008
    label: H.008
    capacity: 15
    room_type: tp_standard
    equipment: [cloison_amovible_h007]

  - id: h007_h008
    label: H.007-008
    # Salle "fusion" (retour utilisateur 28/08/2026 : « la 07 08 sont
    # collées et peuvent s'ouvrir pour faire qu'une salle donc on peut
    # mettre un TD dedans ») — bookable comme UNE salle à part entière ;
    # occuper H.007 OU H.008 individuellement la bloque aussi, et
    # inversement (cf. `combines` + `solver/rooms.py::_build_conflict_map`).
    # `combined`, pas `standard` : priorité volontairement basse (dernier
    # recours des règles TD ci-dessous) plutôt qu'au même rang que les
    # vraies salles standard — sinon elle serait choisie AVANT elles dès
    # qu'une petite salle suffit (30 < 35, tri "best fit"), immobilisant
    # deux salles pour rien.
    capacity: 30
    room_type: combined
    combines: [h007, h008]
    equipment: []

  - id: h009
    label: H.009 (Design)
    capacity: 30
    room_type: td_design
    equipment: [evier, peinture, papier, televiseur]  # priorité ALO/GLE, débordement H.006

  - id: h016
    label: H.016 (Salle Mac)
    capacity: 24
    room_type: tp_mac
    equipment: [postes_apple, videoprojecteur]  # pas de fenêtres -> dernier recours strict

  - id: h017
    label: H.017 (Studio)
    capacity: 20
    room_type: studio_av
    equipment: [camera, micro, montage, regie_av]

  - id: h022
    label: H.022 (fantôme Studio)
    capacity: 16
    room_type: studio_av
    equipment: [rangement]  # salle "hack Celcat" jumelée à H.017 pour 2e prof

  - id: h018
    label: H.018 (Amphi MMI)
    capacity: 150
    room_type: amphi
    equipment: [videoprojecteur, sonorisation]  # CM uniquement, ~140 places, cap. 4 TD

  # --- 1er étage ---
  - id: h101
    label: H.101
    capacity: 35
    room_type: standard
    equipment: [televiseur]

  - id: h103
    label: H.103 (Anglais)
    capacity: 36
    room_type: tp_anglais
    equipment: [ilots]  # 6 îlots, salle attitrée Thomas Pavie tous parcours/semestres

  - id: h104
    label: H.104
    capacity: 35
    room_type: standard
    equipment: [videoprojecteur]

  - id: h105
    label: H.105
    capacity: 35
    room_type: standard
    equipment: [videoprojecteur]

  - id: h111
    label: H.111
    capacity: 35
    room_type: standard
    equipment: [videoprojecteur]

  # --- 2e étage ---
  - id: h201
    label: H.201
    capacity: 35
    room_type: standard
    equipment: [cloison_ouverte_h203]  # fusionnée en permanence avec H.203

  - id: h203
    label: H.203
    capacity: 35
    room_type: standard
    equipment: [cloison_ouverte_h201]

  - id: h201_h203
    label: H.201-203
    # Même scénario que H.007-008 (retour utilisateur 28/08/2026 : « c'est
    # le même scénario pour la 201 et 203 »), capacité 35+35 — priorité
    # basse (`combined`), dernier recours, cf. commentaire sur h007_h008.
    capacity: 70
    room_type: combined
    combines: [h201, h203]
    equipment: []

  - id: h205
    label: H.205 (VR/Réseaux)
    # 16 -> 35 (retour utilisateur 28/08/2026 : « elle peut accueillir des
    # TD mais exceptionnellement, elle est priorisée en VR réseaux dev et
    # game dev ») — la capacité "chaises dans la pièce" est bien 35, mais
    # elle reste un TOUT DERNIER recours pour un TD générique (cf. règle TD
    # plus bas) : les cours VR/réseaux/dev gardent leur priorité via la
    # règle `["*D"]` existante (préférée à égalité avec `tp_standard`).
    capacity: 35
    room_type: tp_vr_reseaux
    equipment: [baie_serveurs, imprimante_3d, pc_puissants, casques_vr]

  # --- Bâtiment A ---
  - id: a018
    label: A.018 (Évaluation)
    capacity: 150
    room_type: evaluation
    equipment: [salle_examen]  # ex. WR107 CM2 = évaluation

# Règles d'affectation salle. `_find_matching_rule` retient la DERNIÈRE règle qui
# matche (session_types + course_code_patterns) -> règles génériques d'abord,
# règles spécifiques par module ensuite pour qu'elles priment.
room_assignment_rules:
  # -- Défauts génériques --
  - session_types: [CM]
    preferred_room_types: [amphi]
    fallback_room_types: [standard]
    same_room_for_course: true

  - session_types: [TD]
    preferred_room_types: [standard]
    # `combined` (H.007-008/H.201-203) et `tp_vr_reseaux` (H.205) en TOUT
    # dernier recours (retour utilisateur 28/08/2026) : jamais préférées à
    # une vraie salle standard/TP libre, seulement quand rien d'autre ne
    # convient — H.205 reste par ailleurs prioritaire pour les cours
    # VR/réseaux/dev via la règle `["*D"]` plus bas, indépendante de celle-ci.
    fallback_room_types: [tp_standard, tp_mac, combined, tp_vr_reseaux]

  - session_types: [TP]
    preferred_room_types: [tp_standard, standard]
    fallback_room_types: [tp_mac]

  # -- BUT3-DEV-FC : cohorte de 8-10, petites salles en priorité --
  # Retour utilisateur (07/08/2026) : "pour les 3e année dev FC il faut les
  # mettre dans la H.005 le plus souvent possible ou les petites salles car
  # c'est uniquement un groupe de 8". Sans cette règle leurs séances (toutes
  # émises en TD, cf. cohorte à groupe unique) viseraient les salles
  # `standard` — toutes à 35 places, donc largement surdimensionnées.
  # `tp_standard` en préféré + tri "best fit" (cf. `assign_rooms`) fait
  # tomber H.005 en premier choix (capacité identique à H.006/007/008
  # depuis le 28/08/2026 — toutes à 15 désormais —, mais H.005 gagne les
  # égalités en restant déclarée en premier dans ce fichier), H.006/007/008
  # ensuite si H.005 est déjà prise à ce créneau.
  # WRA501D (Anglais) volontairement EXCLU : il garde la salle attitrée
  # d'anglais via la règle ci-dessous, qui matche après (dernière règle
  # gagnante, cf. `_find_matching_rule`).
  #
  # WSA501D (SAE, seule SAE effectivement placée par le solveur, cf.
  # `load_solver_scheduled_sae`) AJOUTÉE le 28/08/2026 (retour utilisateur :
  # « on a des cours la première semaine où on n'y est pas [en H.005] alors
  # que je vois que c'est possible ») — code préfixé WS, pas WR, donc absent
  # de la liste WRA5* d'origine ; retombait sur la règle TD/TP générique
  # (`standard`), atterrissant en H.104 malgré H.005 libre au même créneau.
  - course_code_patterns:
      ["WRA502D", "WRA503D", "WRA504D", "WRA505D", "WRA506D", "WRA507D", "WRA508D", "WRA509D", "WRA510D", "WSA501D"]
    session_types: [TD, TP]
    preferred_room_types: [tp_standard, standard]
    fallback_room_types: [tp_mac, td_design]

  # -- WR101/WR102 (Anglais / Renforcé) : H.103 systématique, tous parcours --
  - course_code_patterns: ["WR101", "WR102", "WRA1*", "WR301D", "WR302D"]
    session_types: [TD, TP]
    preferred_room_types: [tp_anglais]
    fallback_room_types: [standard]

  # -- WR103 (Ergonomie) : TD en parallèle, salles couplées en priorité --
  - course_code_patterns: ["WR103"]
    session_types: [CM]
    preferred_room_types: [amphi]
    fallback_room_types: [standard]
  - course_code_patterns: ["WR103"]
    session_types: [TD]
    preferred_room_types: [standard]
    fallback_room_types: [studio_av, tp_mac]

  # -- WR104 (Culture numérique) : Martial Martin seul, pool 1er étage --
  - course_code_patterns: ["WR104"]
    session_types: [TD]
    preferred_room_types: [standard]
    fallback_room_types: [tp_standard]

  # -- WR105 (Stratégies com.) : pool 1er étage --
  - course_code_patterns: ["WR105"]
    session_types: [TD]
    preferred_room_types: [standard]
    fallback_room_types: [tp_standard]

  # -- WR106 (Expression) : TP priorité vraies salles TP avant TD, H.009 basse
  #    priorité, H.016 dernier recours strict --
  - course_code_patterns: ["WR106"]
    session_types: [TD]
    preferred_room_types: [standard]
    fallback_room_types: [tp_standard, td_design, tp_mac]
  - course_code_patterns: ["WR106"]
    session_types: [TP]
    preferred_room_types: [tp_standard, tp_anglais]
    fallback_room_types: [td_design, tp_mac]

  # -- WR107 (Écriture multimédia) : TD Studio puis pool 1er étage,
  #    TP H.103 (îlots), malus H.007/H.008 --
  - course_code_patterns: ["WR107"]
    session_types: [CM]
    preferred_room_types: [amphi]
    fallback_room_types: [standard]  # 2e CM = évaluation -> voir a018 en dur si besoin
  - course_code_patterns: ["WR107"]
    session_types: [TD]
    preferred_room_types: [studio_av]
    fallback_room_types: [standard]
  - course_code_patterns: ["WR107"]
    session_types: [TP]
    preferred_room_types: [tp_anglais]
    fallback_room_types: [tp_standard]

  # -- WR108/WR109 (Production graphique / Culture artistique) : H.009 priorité,
  #    repli H.006 --
  - course_code_patterns: ["WR108", "WR109"]
    session_types: [TD, TP]
    preferred_room_types: [td_design]
    fallback_room_types: [tp_standard]

  # -- WR110 (Prod. audio/vidéo) : TD 4 salles en parallèle dont Studio,
  #    TP duos synchronisés au Studio --
  - course_code_patterns: ["WR110"]
    session_types: [TD]
    preferred_room_types: [studio_av, standard]
    fallback_room_types: [tp_standard]
  - course_code_patterns: ["WR110"]
    session_types: [TP]
    preferred_room_types: [studio_av]
    fallback_room_types: [tp_standard]

  # -- WR112/WR113 (Intégration / Dev Web) : duos synchronisés, salles couplées --
  - course_code_patterns: ["WR112", "WR113"]
    session_types: [TD, TP]
    preferred_room_types: [tp_standard, standard]
    fallback_room_types: [tp_vr_reseaux]

  # -- WR115 (Hébergement) / WR116 (Repr. traitement info) : salles classiques,
  #    malus H.016/H.017/H.009 (donc absentes des listes ci-dessous) --
  - course_code_patterns: ["WR115", "WR116"]
    session_types: [TD, TP]
    preferred_room_types: [standard, tp_standard]
    fallback_room_types: [tp_vr_reseaux]

  # -- WR117 (Gestion de projet) : pas de parallélisme requis, salles classiques --
  - course_code_patterns: ["WR117"]
    session_types: [TD, TP]
    preferred_room_types: [standard]
    fallback_room_types: [tp_standard]

  # -- WR118 (Éco/gestion/droit) / WR119 (PPP) : préférence 1er étage --
  - course_code_patterns: ["WR118", "WR119"]
    session_types: [TD]
    preferred_room_types: [standard]
    fallback_room_types: [tp_standard]

  # -- WR120 (Soutien) : 4 enseignants en parallèle, salles classiques --
  - course_code_patterns: ["WR120"]
    session_types: [TD]
    preferred_room_types: [standard]
    fallback_room_types: [tp_standard]

  # -- Développement (S3-DEV-FI et suivants, codes en *D) : labos --
  - course_code_patterns: ["*D"]
    session_types: [TP]
    preferred_room_types: [tp_standard, tp_vr_reseaux]
    fallback_room_types: [standard]

  # -- Évaluations : A.018 obligatoire, quel que soit le module (règle dure,
  #    priorité maximale car placée en dernier -> gagne sur toute autre règle) --
  - is_eval: true
    preferred_room_types: [evaluation]
    fallback_room_types: [amphi, standard]
