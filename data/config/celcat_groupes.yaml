# (`ETooManyRecords`), exactement comme celui des matières. On ne peut donc
# le lire que par plages d'identifiants, et le résultat est figé ici.
#
# Un groupe ABSENT de cette table ne produit pas un refus lisible : la
# résolution échoue, `nuit.py::_group_id_pour` retombe sur `0`, et Celcat
# répond « Impossible d'enregistrer l'événement, une des ressources
# affectées a été supprimée » — un message qui parle de suppression alors
# que rien n'a été supprimé. C'était le motif d'échec n°1 en production le
# 09/09/2026 (17 jobs), tous sur `BUT MMI S5 TD EF` et `BUT MMI S5 TD GH`,
# les deux groupes des BUT3 en alternance, qui manquaient ici.
#
# Les identifiants ne se suivent PAS par semestre : le S5 est éparpillé sur
# quatre grappes (1648605, 1655558, 1660025, 1662681). Ne rien déduire d'un
# numéro voisin — relever.


