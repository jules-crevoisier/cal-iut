# Cours dont les séances doivent être fusionnées, par paires consécutives
# (ordre pédagogique), en un seul bloc de plusieurs créneaux de 1h30 — cf.
# modèle `DoubleSessionRule` et `ingestion/normalize.py::_merge_double_sessions`.
# Le solveur ne voit alors plus qu'UNE séance par bloc (`duration_slots`
# correspondant), jamais 2 créneaux indépendants pouvant être dispersés dans
# la semaine.
#
# Donnée confirmée par l'utilisateur (jamais devinée, cf. règle "donnée
# fraîche" du projet) : les TP de WR110 doivent être des blocs de 3h (2
# séances de 1h30 collées). Mécanisme volontairement générique, annoncé
# comme récurrent sur d'autres cours/TP à venir — ajouter une entrée ici
# suffit, aucun changement de code nécessaire.
rules:
  - course_code: WR110
    session_type: TP
    slots_per_session: 2
    note: "Confirmé (retour utilisateur) : TP WR110 = blocs de 3h (2x1h30 collées)."

  # WR104 : pas de progression réelle définie -> séquence synthétique
  # CM puis TD (déjà correcte pour l'ordre demandé : "placer d'abord tous les
  # CM puis ensuite les TD"). Reste à coller les TD en blocs de 3h ("2 TD
  # côte à côte") : 5 TD au volume -> 2 blocs de 3h + 1 séance seule de 1h30
  # (reliquat impair, pas de donnée supplémentaire à inventer).
  - course_code: WR104
    session_type: TD
    slots_per_session: 2
    pair_from: start
    note: "Confirmé (retour utilisateur) : TD WR104 = blocs de 3h (2x1h30 collées)."

  # WR106 : progression réelle = TD1-4, TP1-4, CM1, TP5-7, CM2(éval), CM3(éval)
  # — déjà exactement l'ordre demandé. Seuls CM2+CM3 (éval de fin de
  # semestre) doivent être collés en un bloc de 3h pour une évaluation en
  # amphi ; CM1 doit rester une séance seule en tête, d'où `pair_from: end`
  # (apparie depuis la fin de la liste des CM, pas depuis le début).
  - course_code: WR106
    session_type: CM
    slots_per_session: 2
    pair_from: end
    note: "Confirmé (retour utilisateur) : CM2+CM3 WR106 (éval fin de semestre) = bloc de 3h en amphi, CM1 reste seul."

  # WRA308M (Écriture multimédia et narration, BUT2-CREACOM-FC) : 6 TD au
  # total. Retour Marine Riguet : "prévoir les 3 derniers TD à la suite (sur
  # une matinée ou une après-midi) pour que je puisse proposer une activité
  # notée aux étudiants sur 4h30". `max_blocks: 1` est indispensable : sans
  # lui, `pair_from: end` collerait AUSSI les TD 1-2-3 en un second bloc de
  # 4h30, ce que personne n'a demandé.
  - course_code: WRA308M
    session_type: TD
    slots_per_session: 3
    pair_from: end
    max_blocks: 1
    note: "Confirmé (Marine Riguet) : les 3 derniers TD WRA308M = 1 bloc de 4h30 (activité notée)."

  # WSA501D (SAE "Développer pour le web / Concevoir un dispositif interactif",
  # BUT3-DEV-FC) : 34 TD au volume. Retour utilisateur (25/08/2026) : « on fait
  # des cours de 3h minimum, 4h30 max ». 34 étant pair, `slots_per_session: 2`
  # forme 17 blocs de 3h exactement, sans reliquat de 1h30 — un découpage en
  # blocs de 3 (4h30) laisserait 11 blocs + 1 séance seule de 1h30, sous le
  # minimum demandé. Les 17 blocs se répartissent sur les 10 semaines de
  # présence IUT du parcours (~1,7 bloc/semaine), ce qui satisfait le
  # « étendu sur tout le semestre ».
  - course_code: WSA501D
    session_type: TD
    slots_per_session: 2
    pair_from: start
    note: "Confirmé (retour utilisateur 25/08/2026) : WSA501D = blocs de 3h (2x1h30 collées), étalés sur le semestre."
