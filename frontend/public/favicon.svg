<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="cal-iut">
  <!-- Marque : une grille d'emploi du temps stylisée, avec une case
       "occupée" mise en avant — c'est littéralement ce que fait l'outil.
       Couleur reprise de `--accent` (#4d3fae, thème clair) pour rester
       cohérente avec l'interface. Format SVG : net à toutes les tailles,
       pas de jeu de PNG à maintenir pour un outil interne. -->
  <rect width="64" height="64" rx="14" fill="#4d3fae"/>

  <!-- Anneaux de reliure : lit "calendrier" instantanément à 16px. -->
  <rect x="19" y="7" width="5" height="10" rx="2.5" fill="#d7d2f5"/>
  <rect x="40" y="7" width="5" height="10" rx="2.5" fill="#d7d2f5"/>

  <!-- Corps du calendrier -->
  <rect x="11" y="14" width="42" height="41" rx="7" fill="#ffffff"/>
  <!-- Bandeau d'en-tête, plus soutenu que le corps -->
  <rect x="11" y="14" width="42" height="9" rx="7" fill="#b9b1ee"/>
  <rect x="11" y="19" width="42" height="4" fill="#b9b1ee"/>

  <!-- Trame : 3 colonnes x 3 lignes de créneaux -->
  <g fill="#cfd3e2">
    <rect x="17" y="28" width="9" height="6" rx="2"/>
    <rect x="41" y="28" width="9" height="6" rx="2"/>
    <rect x="17" y="38" width="9" height="6" rx="2"/>
    <rect x="29" y="38" width="9" height="6" rx="2"/>
    <rect x="29" y="48" width="9" height="4" rx="2"/>
  </g>

  <!-- La séance "placée" : l'accent du produit -->
  <rect x="29" y="28" width="9" height="6" rx="2" fill="#4d3fae"/>
  <rect x="41" y="38" width="9" height="6" rx="2" fill="#b9702a"/>
</svg>
